; PlatformIO Project Configuration File
;
; Aquarium Controller - Adafruit ESP32 Feather V2 + 3.5" TFT FeatherWing
;
; Upload workflow:
;   1. First flash: plug in USB-C, run "Upload" (uses serial by default below).
;   2. After device boots and connects to WiFi, switch to OTA by uncommenting
;      the [env:ota] section below, or by running:
;        pio run -e ota -t upload
;   3. mDNS hostname is set in wifi_ota.cpp (default: aquarium.local)

[platformio]
default_envs = serial

[env]
; 7.1.3 = Arduino core 2.0.17 (IDF 4.4.7) with native arm64 toolchain.
; The official platform stays on core 2.x; 3.x would need the pioarduino fork.
platform = espressif32@7.1.3
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200

; Exact pins so a clean build can't silently pick up breaking changes.
lib_deps =
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit HX8357 Library@1.1.20
  adafruit/Adafruit TSC2007@1.1.2
  adafruit/Adafruit BusIO@1.17.4
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@4.0.6
  mathieucarbou/ESPAsyncWebServer@3.6.0
  mathieucarbou/AsyncTCP@3.3.2

build_flags =
  -DCORE_DEBUG_LEVEL=3

; ---------- USB / serial upload (use for first flash) ----------
[env:serial]
upload_protocol = esptool
upload_speed = 115200

; ---------- OTA upload (use after first flash) ----------
; To upload over WiFi:  pio run -e ota -t upload
; Or set default_envs = ota above.
[env:ota]
upload_protocol = espota
upload_port = aquarium.local
; If mDNS is flaky, hardcode the IP instead:
; upload_port = 10.0.0.89
upload_flags =
  --port=3232
monitor_port = socket://aquarium.local:23
